[package]
name = "first_light"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19.1", features = ["wav"] }
glam = "0.32"

[features]
# Faster incremental iteration: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]
# Browser build (Trunk): WebGPU backend so volumetric fog and the sea material work in the browser.
web = ["bevy/web", "bevy/webgpu"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Browser iteration: optimized deps, no LTO, parallel codegen. Rebuilds in about a minute;
# the .wasm is larger. `trunk build --cargo-profile web-dev`
[profile.web-dev]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
opt-level = 2
debug = false
